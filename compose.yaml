services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
      POSTGRES_DB: frontdesk
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "frontdesk"]
      interval: 2s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql

  migrate:
    build: ./app
    command: ["frontdesk", "migrate"]
    environment:
      DATABASE_URL: postgresql://frontdesk:frontdesk@db:5432/frontdesk
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://frontdesk:frontdesk@db:5432/frontdesk
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:

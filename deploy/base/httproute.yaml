apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontdesk
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - frontdesk.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: frontdesk-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: frontdesk
      owner: frontdesk
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: frontdesk-db
  annotations:
    # Argo CD prunes resources removed from Git. The database is the one
    # resource whose loss cannot be recovered from Git, so it is never pruned.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: frontdesk
      owner: frontdesk
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

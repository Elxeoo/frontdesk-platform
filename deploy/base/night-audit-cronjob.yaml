apiVersion: batch/v1
kind: CronJob
metadata:
  name: night-audit
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Istanbul
  # No startingDeadlineSeconds on purpose: a missed audit runs late rather
  # than never, because a business day must close before the next one opens.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: night-audit
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: night-audit
              image: ghcr.io/elxeoo/frontdesk-api
              command: ["frontdesk", "night-audit"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: frontdesk-db-app
                      key: uri
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

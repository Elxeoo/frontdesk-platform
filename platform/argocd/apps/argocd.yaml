# Argo CD manages its own Helm release. Prune stays off: a bad commit must not
# delete Argo CD's own components, because a broken Argo CD cannot repair itself.
# The helm upgrade command in the Makefile is the manual recovery path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: https://github.com/Elxeoo/frontdesk-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

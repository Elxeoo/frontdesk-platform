# Only our own images: third-party images carry their publishers' signatures, not ours.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-images
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: ghcr.io/elxeoo/*
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - subject: https://github.com/Elxeoo/frontdesk-platform/.github/workflows/release.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: image must be signed by the release workflow on main

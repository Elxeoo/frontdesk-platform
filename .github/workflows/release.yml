name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "deploy/**"              # loop guard for bot commits; not applied to tag pushes

permissions:
  contents: read
  packages: write
  id-token: write                # request a short-lived OIDC token for keyless signing; no repo write

concurrency:
  group: release
  queue: max

env:
  # Never `latest`: every image traces back to a tag or a commit.
  API_IMAGE: ghcr.io/elxeoo/frontdesk-api:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  WEB_IMAGE: ghcr.io/elxeoo/frontdesk-web:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}   # the API reports this as its version

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build --build-arg APP_VERSION="$APP_VERSION" -t "$API_IMAGE" ./app
      - run: docker build -t "$WEB_IMAGE" ./web

      # Scan the exact images that will be pushed, with the same gate as pr.yml.
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true             # unfixable findings are not actionable
          exit-code: "1"                   # a finding fails the step (default 0 = fake green)
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        # Through stdin, so the token never appears as a command-line argument.
      - run: docker push "$API_IMAGE"
      - run: docker push "$WEB_IMAGE"

      # The registry assigns the digest during push, so it exists only from here on.
      - name: Print digests
        run: |
          docker inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$WEB_IMAGE"

      # Keyless signature on the digest, not the tag: a tag can be moved to another image.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4         # pin the binary too, not only the action
      - name: Sign images
        run: |
          API_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE")
          WEB_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$WEB_IMAGE")
          cosign sign --yes "$API_REF"
          cosign sign --yes "$WEB_REF"

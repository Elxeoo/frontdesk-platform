name: pr-checks

on:
  pull_request:
    branches: [main]
                                 # no `paths:` filter: a required check skipped by a filter waits forever

permissions:
  contents: read                 # least privilege

jobs:
  lint:
    runs-on: ubuntu-24.04        # fixed runner image, not ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"           # same as the Dockerfile base image
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      db:
        image: postgres:18.6-alpine3.24        # same image as compose.yaml
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk_test          # name must end in _test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontdesk"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk_test
  smoke:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build
      - run: timeout 90 bash -c 'until curl -sf http://127.0.0.1:18080/readyz; do sleep 2; done'
      - run: bash scripts/smoke-test.sh
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frontdesk-platform-api:latest   # compose names images <folder>-<service>
          version: v0.76.2                           # pin the Trivy binary too, not only the action
          severity: CRITICAL,HIGH
          ignore-unfixed: true                       # unfixable findings are not actionable
          exit-code: "1"                             # a finding fails the step (default 0 = fake green)
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frontdesk-platform-web:latest
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"      
      - if: failure()
        run: docker compose logs

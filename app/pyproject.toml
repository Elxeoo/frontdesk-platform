[project]
name = "frontdesk"
version = "0.1.0"
description = "Hotel front desk API and night audit for the FrontDesk platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-prometheus>=0.51b0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "prometheus-client>=0.21",
    "azure-identity>=1.19",
    "azure-storage-blob>=12.24",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "ruff>=0.9",
]

[project.scripts]
frontdesk = "frontdesk.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontdesk = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs a PostgreSQL database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]
